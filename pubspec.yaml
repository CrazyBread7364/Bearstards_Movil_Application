name: bearstards_movil_application
description: "Wiki móvil de consulta del MVP de Bearstards para Android e iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/bitstream-vera-license.txt
    - assets/images/wiki_low_poly/background_toy_warehouse_night.png
    - assets/images/wiki_low_poly/bear_hero_behind_crates.png
    - assets/images/wiki_low_poly/bear_player_fullbody.png
    - assets/images/wiki_low_poly/bear_npc_fullbody.png
    - assets/images/wiki_low_poly/hero_foreground_crates.png
    - assets/images/wiki_low_poly/logo_hanging_sign.png
    - assets/images/wiki_low_poly/home_card_characters.png
    - assets/images/wiki_low_poly/home_card_stealth.png
    - assets/images/wiki_low_poly/weapon_sewing_needle.png
    - assets/images/wiki_low_poly/weapon_dart_blaster_v2.png
    - assets/images/wiki_low_poly/item_helmet_v2.png
    - assets/images/wiki_low_poly/item_thread_spool.png
    - assets/images/wiki_low_poly/hud_yarn_health.png
    - assets/images/wiki_low_poly/map_toy_store_three_aisles.png
    - assets/images/wiki_low_poly/phase_lights_off.png
    - assets/images/wiki_low_poly/phase_new_stock.png
    - assets/images/wiki_low_poly/phase_final_sale.png
    - assets/images/wiki_low_poly/mechanic_walk_safe.png
    - assets/images/wiki_low_poly/mechanic_run_detected.png
    - assets/images/wiki_low_poly/mechanic_jump_detected.png
    - assets/images/wiki_low_poly/mechanic_weapon_detected.png

  fonts:
    - family: Vera
      fonts:
        - asset: assets/fonts/Vera.ttf
        - asset: assets/fonts/VeraBd.ttf
          weight: 700
